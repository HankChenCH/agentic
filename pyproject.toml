[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ag-ui-protocol>=0.1.19",
    "python-dotenv>=1.0",
    "fastapi>=0.139.0",
    "python-multipart>=0.0.20",
    "langchain>=1.3.11",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.7",
    "sqlmodel>=0.0.39",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "uvicorn>=0.50.0",
    "wireup>=2.11.3",
    "langchain-ollama>=1.1.0",
    "langchain-weaviate>=0.0.8",
    "loguru>=0.7.3",
    "celery[redis]>=5.5",
    # infrastructures/redis 直接 import redis 客户端（此前仅是 celery[redis] 的传递依赖）
    "redis>=5.5",
    "obstore>=0.11.1",
    "httpx>=0.28.0",
    "typer>=0.27.2",
    "alembic>=1.19.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
# cryptography 49+ 不再发布 Intel macOS wheel（macosx 仅剩 arm64），Intel mac 上
# 回退到最后带 universal2 wheel 的 48.x，避免下载 Rust 工具链源码编译；其他平台不受影响
constraint-dependencies = ["cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'"]
