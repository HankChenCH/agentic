name: E2E Frontend

# 前端端到端冒烟（Playwright）：目标是一键部署全栈（deploy/），含真实 LLM。
# 不卡 PR——仅手动触发与 nightly 巡检；需要 LLM key 等 secrets。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *" # UTC 21:00 = 每日夜间巡检

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Full-stack Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: yarn playwright install --with-deps chromium

      # 一键全栈：postgres/weaviate/rustfs/redis/worker/backend/frontend(nginx :8081)
      # 变量名与 deploy/docker-compose.yaml 的必填项对齐
      - name: Start full stack
        working-directory: deploy
        run: docker compose up -d --build
        env:
          DEEPSEEK_API_KEY: ${{ secrets.E2E_DEEPSEEK_API_KEY }}
          AUTH_JWT_SECRET: ${{ secrets.E2E_AUTH_JWT_SECRET }}

      # 后端存活探针是 GET /health（公开），经 nginx /api/ 去前缀代理
      - name: Wait for stack readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8081/ >/dev/null && curl -sf http://127.0.0.1:8081/api/health >/dev/null; then
              echo "stack ready"; exit 0
            fi
            echo "waiting for stack ($i/60)..."; sleep 5
          done
          echo "stack not ready in time"; docker compose -f deploy/docker-compose.yaml logs --tail 100
          exit 1

      - name: Run Playwright smoke
        working-directory: frontend
        run: yarn test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8081

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Tear down stack
        if: always()
        working-directory: deploy
        run: docker compose down -v
