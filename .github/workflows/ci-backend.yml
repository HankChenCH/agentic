name: CI Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    env:
      # app/configs/*.yaml 的 ${VAR} 必填占位符（llm.yaml），缺了配置链加载即失败；
      # 单元测试是纯 unit 级（SQLite 临时库 + stub 向量索引），不会发起真实调用，
      # 哑值即可
      DEEPSEEK_API_KEY: ci-dummy
      OPENAI_API_URL: https://ci.invalid/v1
      OPENAI_API_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest (with coverage)
        run: >
          uv run pytest tests/
          --cov=app --cov-report=term-missing --cov-report=xml

      # 覆盖率仅观测上报、不做失败门禁（阈值基线待稳定后再议）
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

  migrations:
    name: Migrations (alembic on postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agentic
          POSTGRES_PASSWORD: agentic
          POSTGRES_DB: agentic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentic -d agentic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # llm.yaml 必填占位符哑值（同 test job）；迁移只装配配置，不调用模型
      DEEPSEEK_API_KEY: ci-dummy
      # db.yaml 的 postgres entry（缺省端口/凭据与上方服务容器一致），只覆盖 host 指向
      DB_DEFAULT: postgres
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # 空库跑完整迁移链 = 部署栈 migrate 服务的同款动作（建表不做于应用启动期）
      - name: Alembic upgrade head
        run: uv run python -m app.cmd.admin db upgrade

      # 列级 diff 门禁：迁移后的库结构必须与 SQLModel.metadata 零差异，
      # 「模型改了但迁移没跟上」在此失败（口径同 revision --autogenerate）
      - name: Model/migration diff check
        run: uv run python -m app.cmd.admin db check

      # downgrade 冒烟：整链回退到 base，验证每个 downgrade() 可执行。
      # drop_table 不顺带清理的对象（PG 原生枚举类型、被自引用 FK 依赖的
      # 唯一索引等）会在下面的回退净空校验 / re-upgrade 撞
      # DependentObjectsStillExist / CREATE TYPE already exists 时暴露。
      - name: Alembic downgrade base (smoke)
        run: uv run python -m app.cmd.admin db downgrade base

      # 回退净空校验：public 下只应剩 alembic_version（空记录），枚举类型零残留
      - name: Verify downgrade leaves empty schema
        run: |
          tables=$(psql "postgresql://agentic:agentic@127.0.0.1:5432/agentic" -tAc "select count(*) from information_schema.tables where table_schema = 'public'")
          enums=$(psql "postgresql://agentic:agentic@127.0.0.1:5432/agentic" -tAc "select count(*) from pg_type where typtype = 'e'")
          echo "tables remaining: ${tables}, enum types remaining: ${enums}"
          test "${tables}" = "1" && test "${enums}" = "0"

      # 圆环闭环：回退后整链再升级 + 再 diff 检查——迁移链必须可重复运行，
      # 回退不干净（残留表/类型）会在此失败
      - name: Alembic re-upgrade head
        run: uv run python -m app.cmd.admin db upgrade

      - name: Re-run model/migration diff check
        run: uv run python -m app.cmd.admin db check
