name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node 24：react-router 8.3 的 engines 要求 >=22.22.0，本机 fnm 的 22.18 不满足
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Oxlint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests (vitest)
        run: yarn test

      - name: Build
        run: yarn build
