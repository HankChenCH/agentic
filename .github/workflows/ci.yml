name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    env:
      # app/configs/*.yaml 的 ${VAR} 必填占位符（llm.yaml），缺了配置链加载即失败；
      # 单元测试是纯 unit 级（SQLite 临时库 + stub 向量索引），不会发起真实调用，
      # 哑值即可
      DEEPSEEK_API_KEY: ci-dummy
      OPENAI_API_URL: https://ci.invalid/v1
      OPENAI_API_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest
        run: uv run pytest tests/
