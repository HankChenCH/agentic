# Alembic 迁移配置。
#
# sqlalchemy.url 刻意留空：实际 URL 由 migrations/env.py 从应用自身配置链
# 解析（AppConfig → DatabaseFactory → engine.url），AGENTIC_CONFIG_DIR /
# AGENTIC_ENV_FILE 照常生效——这里不维护第二份连接事实。
#
# %(here)s 锚定到本文件所在目录（server/），使 alembic 命令不依赖 CWD。
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
