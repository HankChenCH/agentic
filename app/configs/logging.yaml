# 日志配置 → LoggingConfig（app/core/config/logging.py）
#
# - level：全局级别，可被环境变量 AGENTIC_LOG_LEVEL 覆盖；留空则按运行环境
#   推导（dev/test=DEBUG，prod=INFO）
# - format：loguru 语法格式串，每个 sink 可用 format 覆盖；{name} 已由装配层
#   对齐门面/桥接声明的 logger 名（等价 stdlib %(name)s，不随调用帧漂移）
# - sinks：输出位置列表，type 判别（console / file）；file 独享
#   rotation / retention / compression / enqueue 流转规则
# - backtrace / diagnose：异常详略（prod 建议 diagnose: false 防泄露变量值）
#
# 环境变量插值与 llm.yaml 等一致：${VAR} / ${VAR:default} / ${VAR:-default}

level: ${AGENTIC_LOG_LEVEL:}
format: "{time:YYYY-MM-DD HH:mm:ss.SSS} | {level: <8} | {name} | {message}"
backtrace: true
diagnose: true

sinks:
  - type: console

  - type: file
    path: ${AGENTIC_LOG_DIR:runtime/logs}/agentic.log
    rotation: 10 MB      # 单文件超限即切割，也支持 '1 week' / '12:00' 定时
    retention: 10        # 最多保留 10 份历史文件
    compression: zip     # 切割出的历史文件压缩
    serialize: true      # 文件走 JSON 行，便于采集解析
