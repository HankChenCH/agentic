[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ag-ui-protocol>=0.1.19",
    "python-dotenv>=1.0",
    "fastapi>=0.139.0",
    "python-multipart>=0.0.20",
    "langchain>=1.3.11",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.7",
    "sqlmodel>=0.0.39",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "uvicorn>=0.50.0",
    "wireup>=2.11.3",
    "langchain-ollama>=1.1.0",
    "langchain-weaviate>=0.0.8",
    "loguru>=0.7.3",
    "celery[redis]>=5.5",
    # infrastructures/redis 直接 import redis 客户端（此前仅是 celery[redis] 的传递依赖）
    "redis>=5.5",
    "obstore>=0.11.1",
    "httpx>=0.28.0",
    "typer>=0.27.2",
    "alembic>=1.19.1",
    # 用户域：JWT 签发/验签（密码哈希用 stdlib pbkdf2，不引 passlib）
    "pyjwt>=2.10.0",
    "prometheus-client>=0.21",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.16.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
# 只收单元套件：裸 `pytest` 不误扫 tests_e2e/（e2e 需运行中服务 + 真实 LLM，
# 永远显式跑 `pytest tests_e2e/`）
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# 明确选最小高信号规则集（E4/E7/E9 + pyflakes），不随 ruff 默认集变化漂移；
# isort/pyupgrade 等风格规则未启用（存量代码未按此整形，避免 CI 噪音）
select = ["E4", "E7", "E9", "F"]

[tool.uv]
# cryptography 49+ 不再发布 Intel macOS wheel（macosx 仅剩 arm64），Intel mac 上
# 回退到最后带 universal2 wheel 的 48.x，避免下载 Rust 工具链源码编译；其他平台不受影响
constraint-dependencies = ["cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'"]
