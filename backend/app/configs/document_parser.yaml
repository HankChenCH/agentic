default: mineru-cloud
providers:
  mineru-cloud:
    type: mineru_cloud
    api_url: https://mineru.net
    api_key: ${MINERU_API_KEY:} # 控制台申请的 Bearer token；留空时首次解析会 fail-fast
    language: ch
    enable_formula: true
    enable_table: true
    is_ocr: true # 扫描件兜底走 OCR；纯文本 PDF 云端会自动跳过
    timeout: 60
    poll_interval: 5
    poll_timeout: 1800
  local-xlsx:
    type: local_xlsx
    rows_per_block: 20 # 单个 TABLE 块的数据行窗口（表头每块重复）
    max_rows_per_sheet: 1000
    max_cols: 64
  local-docx:
    type: local_docx
# 文件后缀 → 解析器 entry 路由表：上传白名单（domain/knowledge/support.py 的
# ALLOWED_UPLOAD_SUFFIXES）与之对应，新增可解析格式 = 加 provider entry + 一行路由
routing:
  .pdf: mineru-cloud
  .xlsx: local-xlsx
  .docx: local-docx
